name: Günlük rapor + fikirler

on:
  schedule:
    - cron: "41 16 * * *"   # 16:41 UTC = 00:41 Şanghay saati -> bir önceki günün raporu
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-MM-DD, today veya yesterday)"
        required: false
        default: "yesterday"

permissions:
  contents: write

concurrency:
  group: trend-radar-commit
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raporu oluştur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python report.py --date "${{ github.event.inputs.date || 'yesterday' }}"

      - name: Raporu kaydet
        run: |
          git config user.name  "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add reports docs/data
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "report: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
