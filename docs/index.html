<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar</title>
<style>
  /* Harici font/CDN yok: Çin'den de açılsın diye sadece sistem fontları */
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1b19; --muted: #6b6a64; --line: #e4e2da;
    --accent: #d2481c; --accent-soft: #fbe6dd; --good: #1f7a4d; --good-soft: #dff2e7;
    --chip: #efede6; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --panel: #1b1b19; --ink: #ecebe6; --muted: #9c9a92; --line: #2c2b28;
      --accent: #ff7a4a; --accent-soft: #3a2117; --good: #5fd19a; --good-soft: #17301f;
      --chip: #26251f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  select {
    font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
  }
  .summary {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .patterns { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    box-shadow: var(--shadow); min-width: 0;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 4px 0; font-size: 14px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
  .chip.m { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .hook { font-style: italic; border-left: 2px solid var(--line); padding-left: 8px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  td.n { color: var(--muted); width: 32px; }
  td.v { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .term a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .term a:hover { text-decoration: underline; }
  .news { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .news a { color: inherit; }
  .badge { display: inline-block; font-size: 11px; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .badge.new { background: var(--accent-soft); color: var(--accent); }
  .badge.rec { background: var(--good-soft); color: var(--good); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 640px) {
    th.h, td.h { display: none; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Trend <span>Radar</span></h1>
      <div class="sub" id="meta">Yükleniyor…</div>
    </div>
    <select id="day" aria-label="Gün seç"></select>
  </header>

  <div id="ai"></div>

  <h2>Ülkelere göre trendler</h2>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="note" id="cnote"></p>
  <div id="table"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = { data: null, geo: null };

async function getJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function renderAI(ai) {
  if (!ai) {
    $("ai").innerHTML = `<div class="summary">Bu gün için AI fikir özeti yok. (GitHub'da <b>ANTHROPIC_API_KEY</b> secret'ı ekleyince her gün otomatik oluşur.)</div>`;
    return;
  }
  const pats = (ai.patterns || []).map((p) => `<li>${esc(p)}</li>`).join("");
  const apps = (ai.app_ideas || []).map((a) => `
    <div class="card">
      <h3>${esc(a.title)}</h3>
      <p><span class="k">Problem</span><br>${esc(a.problem)}</p>
      <p><span class="k">Neden şimdi</span><br>${esc(a.why_now)}</p>
      <p><span class="k">MVP</span><br>${esc(a.mvp)}</p>
      <div class="chips"><span class="chip m">${esc(a.market)}</span><span class="chip">${esc(a.effort)}</span>${(a.trends||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    </div>`).join("");
  const vids = (ai.video_ideas || []).map((v) => `
    <div class="card">
      <h3>${esc(v.title)}</h3>
      <p class="hook">“${esc(v.hook)}”</p>
      <div class="chips"><span class="chip m">${esc(v.market)}</span><span class="chip">${esc(v.format)}</span><span class="chip">${esc(v.timing)}</span>${(v.trends||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    </div>`).join("");
  $("ai").innerHTML = `
    <div class="summary">${esc(ai.summary)}${pats ? `<ul class="patterns">${pats}</ul>` : ""}</div>
    ${apps ? `<h2>Uygulama fikirleri</h2><div class="grid">${apps}</div>` : ""}
    ${vids ? `<h2>Video fikirleri</h2><div class="grid">${vids}</div>` : ""}`;
}

function renderTabs() {
  const cs = state.data.countries;
  $("tabs").innerHTML = cs.map((c) =>
    `<button class="tab" role="tab" aria-selected="${c.geo === state.geo}" data-geo="${c.geo}">${c.flag} ${esc(c.name)} <span class="sub">${c.trends.length}</span></button>`
  ).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => { state.geo = b.dataset.geo; renderTabs(); renderTable(); });
}

function renderTable() {
  const c = state.data.countries.find((x) => x.geo === state.geo);
  const note = state.data.ai?.countries?.[state.geo];
  $("cnote").textContent = note || "";
  if (!c || !c.trends.length) { $("table").innerHTML = `<div class="empty">Bu ülke için veri yok.</div>`; return; }
  const isCN = c.geo === "CN";
  const rows = c.trends.map((t, i) => {
    const badges = (t.is_new ? `<span class="badge new">yeni</span>` : "") +
                   (t.days_seen_7d >= 3 ? `<span class="badge rec">${t.days_seen_7d}/7 gün</span>` : "");
    const news = (t.news || []).slice(0, 1).map((n) => `<span class="news"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>${n.source ? " · " + esc(n.source) : ""}</span>`).join("");
    const term = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.term)}</a>` : esc(t.term);
    const vol = isCN ? `#${t.best_rank}` : esc(t.traffic_label || "–");
    return `<tr><td class="n">${i + 1}</td><td class="term">${term}${badges}${news}</td><td class="v">${vol}</td><td class="v h">${t.hours} sa</td></tr>`;
  }).join("");
  $("table").innerHTML = `<table><thead><tr><th>#</th><th>Arama</th><th>${isCN ? "Sıra" : "Hacim"}</th><th class="h">Listede</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadDay(day) {
  try {
    state.data = await getJSON(`data/${day}.json`);
  } catch (e) {
    $("meta").textContent = "Veri yüklenemedi: " + e.message;
    return;
  }
  if (!state.data.countries.some((c) => c.geo === state.geo)) state.geo = state.data.countries[0]?.geo;
  $("meta").textContent = `${state.data.date} · ${state.data.snapshots} ölçüm · güncellendi ${state.data.generated_at.replace("T", " ")}`;
  renderAI(state.data.ai);
  renderTabs();
  renderTable();
}

(async function init() {
  let days = [];
  try { days = (await getJSON("data/index.json")).days || []; } catch (e) {}
  if (!days.length) { $("meta").textContent = "Henüz rapor yok. İlk günlük rapor oluşunca burada görünecek."; return; }
  $("day").innerHTML = days.map((d) => `<option>${d}</option>`).join("");
  $("day").onchange = (e) => loadDay(e.target.value);
  loadDay(days[0]);
})();
</script>
</body>
</html>
